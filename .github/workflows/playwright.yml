name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Number of Playwright workers'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      test_tag:
        description: 'Select test tag to run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '@Regression'
          - '@customer'
          - '@smoke'

jobs:
  test:
    name: Run Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          TAG="${{ github.event.inputs.test_tag }}"
          WORKERS="${{ github.event.inputs.workers }}"
          if [ "$TAG" = "all" ]; then
            npx playwright test --workers=$WORKERS
          else
            npx playwright test --grep "$TAG" --workers=$WORKERS
          fi

      - name: Generate Allure HTML report
        if: always()
        run: npm run report:allure:html

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: reports/allure-html-report
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright-report
          retention-days: 30